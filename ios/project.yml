name: Markerup
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "26.5"
settings:
  ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  Markerup:
    type: application
    platform: iOS
    deploymentTarget: "26.5"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Markerup
        CFBundleName: Markerup
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleIconName: AppIcon
        # Markerup does not implement non-exempt cryptography. This lets
        # App Store Connect skip the export-compliance questionnaire for
        # every uploaded build.
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        NSLocalNetworkUsageDescription: Markerup connects directly to the SMB server you choose to access your Markdown workspace.
        UILaunchStoryboardName: LaunchScreen
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    sources:
      - Assets.xcassets
      - LaunchScreen.storyboard
    resources:
      - PrivacyInfo.xcprivacy
    settings:
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    postCompileScripts:
      - name: Build Rust executable
        script: ./build_for_ios_with_cargo.sh markerup
        basedOnDependencyAnalysis: false
      - name: Include privacy manifest in app bundle
        script: |
          set -euo pipefail
          cp "$SRCROOT/PrivacyInfo.xcprivacy" \
            "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/PrivacyInfo.xcprivacy"
        basedOnDependencyAnalysis: false
