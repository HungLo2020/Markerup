name: Release latest

on:
  workflow_run:
    workflows: [iOS build and simulator smoke test]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: latest-release
  cancel-in-progress: true

jobs:
  gate:
    name: Require successful smoke test
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Verify smoke test result
        env:
          SMOKE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SMOKE_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [[ "$SMOKE_CONCLUSION" != "success" || "$SMOKE_BRANCH" != "main" ]]; then
            echo "Refusing release: smoke test conclusion=$SMOKE_CONCLUSION branch=$SMOKE_BRANCH"
            exit 1
          fi

      - name: Record smoke-tested commit
        id: source
        run: echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"

  debian:
    name: Build Debian package
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out smoke-tested source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.source_sha }}

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            dpkg-dev \
            libfontconfig1-dev \
            libgl1-mesa-dev \
            libwayland-dev \
            libx11-dev \
            libxkbcommon-dev

      - name: Select stable Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Build Debian package
        env:
          MARKERUP_BUILD_NUMBER: ${{ github.run_id }}
        run: |
          set -euo pipefail
          cargo build --locked --release
          package_root="$RUNNER_TEMP/markerup-package"
          mkdir -p "$package_root/DEBIAN" "$package_root/usr/bin" "$package_root/usr/share/applications" "$package_root/usr/share/icons/hicolor/scalable/apps"
          install -m 0755 target/release/markerup "$package_root/usr/bin/markerup"
          install -m 0644 resources/markerup_notepad_transparent.svg "$package_root/usr/share/icons/hicolor/scalable/apps/markerup.svg"
          cat > "$package_root/DEBIAN/control" <<EOF
          Package: markerup
          Version: ${GITHUB_RUN_NUMBER}
          Section: editors
          Priority: optional
          Architecture: amd64
          Maintainer: Markerup contributors
          Description: Filesystem-first Markdown notes editor
           Markerup is a Markdown notes editor built with Rust and Slint.
          EOF
          cat > "$package_root/usr/share/applications/markerup.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Markerup
          Comment=Filesystem-first Markdown notes editor
          Exec=markerup
          Icon=markerup
          Terminal=false
          Categories=Office;TextEditor;
          MimeType=text/markdown;text/plain;
          EOF
          mkdir -p release
          dpkg-deb --build --root-owner-group "$package_root" "release/markerup_${GITHUB_RUN_NUMBER}_amd64.deb"
          sha256sum release/* > release/SHA256SUMS

      - name: Upload Debian package artifact
        uses: actions/upload-artifact@v4
        with:
          name: markerup-debian
          path: release/
          if-no-files-found: error

  ios:
    name: Build signed iOS package
    needs: gate
    uses: ./.github/workflows/ios-device.yml
    with:
      source_sha: ${{ needs.gate.outputs.source_sha }}
    secrets: inherit

  release:
    name: Replace latest GitHub release
    needs: [gate, debian, ios]
    runs-on: ubuntu-latest
    steps:
      - name: Check out smoke-tested source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.source_sha }}

      - name: Download Debian package
        uses: actions/download-artifact@v4
        with:
          name: markerup-debian
          path: release-assets

      - name: Download signed iOS package
        uses: actions/download-artifact@v4
        with:
          name: markerup-ios-signed-device
          path: release-assets/ios

      - name: Replace latest release and assets
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.gate.outputs.source_sha }}
        run: |
          set -euo pipefail
          find release-assets -type f -print
          gh release delete latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create latest \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title latest \
            --notes "Automated latest build for ${SOURCE_SHA}. Smoke test passed before packaging." \
            release-assets/markerup_*.deb \
            release-assets/ios/Markerup.ipa
