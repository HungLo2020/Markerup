name: Release latest

on:
  workflow_run:
    workflows: [iOS build and simulator smoke test]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: latest-release
  cancel-in-progress: true

jobs:
  gate:
    name: Require successful smoke test
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Verify smoke test result
        env:
          SMOKE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SMOKE_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [[ "$SMOKE_CONCLUSION" != "success" || "$SMOKE_BRANCH" != "main" ]]; then
            echo "Refusing release: smoke test conclusion=$SMOKE_CONCLUSION branch=$SMOKE_BRANCH"
            exit 1
          fi

      - name: Record smoke-tested commit
        id: source
        run: echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"

  debian:
    name: Build Debian package
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out smoke-tested source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.source_sha }}

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgl1-mesa-dev \
            libwayland-dev \
            libx11-dev \
            libxkbcommon-dev

      - name: Select stable Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.11.4 --locked

      - name: Build Debian package
        env:
          MARKERUP_BUILD_NUMBER: ${{ github.run_id }}
        run: |
          set -euo pipefail
          cargo tauri build --bundles deb -- --locked
          mkdir -p release
          cp target/release/bundle/deb/*.deb release/
          sha256sum release/* > release/SHA256SUMS

      - name: Upload Debian package artifact
        uses: actions/upload-artifact@v4
        with:
          name: markerup-debian
          path: release/
          if-no-files-found: error

  ios:
    name: Build signed iOS package
    needs: gate
    uses: ./.github/workflows/ios-device.yml
    with:
      source_sha: ${{ needs.gate.outputs.source_sha }}
    secrets: inherit

  release:
    name: Replace latest GitHub release
    needs: [gate, debian, ios]
    runs-on: ubuntu-latest
    steps:
      - name: Check out smoke-tested source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.source_sha }}

      - name: Download Debian package
        uses: actions/download-artifact@v4
        with:
          name: markerup-debian
          path: release-assets

      - name: Download signed iOS package
        uses: actions/download-artifact@v4
        with:
          name: markerup-ios-signed-device
          path: release-assets/ios

      - name: Replace latest release and assets
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.gate.outputs.source_sha }}
        run: |
          set -euo pipefail
          find release-assets -type f -print
          gh release delete latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create latest \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title latest \
            --notes "Automated latest build for ${SOURCE_SHA}. Smoke test passed before packaging." \
            release-assets/markerup_*.deb \
            release-assets/ios/Markerup.ipa
