name: CI
on:
  push: { branches: [main, master] }
  pull_request:
  workflow_dispatch:
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Install Tauri system dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with: { toolchain: stable, components: rustfmt, clippy }
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: cargo install tauri-cli --version 2.11.4 --locked
      - run: cargo fmt --all -- --check
      - run: cargo test --all-targets
      - run: cargo check --all-targets
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo tauri build --bundles deb -- --locked
