name: CI

on:
  push:
    branches:
      - feature/linux-mvp
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Slint Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev \
            libx11-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libgl1-mesa-dev

      - name: Select stable Rust
        run: |
          rustup update stable
          rustup default stable

      - name: Test
        run: cargo test --all-targets

      - name: Check
        run: cargo check --all-targets
