name: iOS build and simulator smoke test
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "ios-simulator-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: '26.6' }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with: { toolchain: stable, target: aarch64-apple-ios,aarch64-apple-ios-sim }
      - run: npm ci --prefix frontend
      - name: Build frontend for Rust configuration validation
        run: npm run build --prefix frontend
      - run: cargo install tauri-cli --version 2.11.4 --locked
      - name: Generate the canonical app icon for Apple project initialization
        run: cargo tauri icon resources/markerup_notepad_transparent.svg --output icons --ios-color '#eaf4ff'
      - name: Initialize Tauri Apple project
        run: cargo tauri ios init --ci
      - name: Populate the generated iOS icon catalog from the canonical SVG
        run: cargo tauri icon resources/markerup_notepad_transparent.svg --output icons --ios-color '#eaf4ff'
      - name: Remove alpha channels from generated iOS app icons
        # Apple rejects AppIcon PNGs that have an alpha channel even if every
        # pixel is opaque. This composites Tauri's SVG-derived RGBA files over
        # the configured iOS background and verifies RGB output before Xcode.
        run: python3 DevUtils/normalize_ios_app_icons.py
      - name: Verify app resources and privacy manifest
        run: |
          test -f ios/PrivacyInfo.xcprivacy
          plutil -lint ios/PrivacyInfo.xcprivacy
          test -f icons/icon.png
          test -f gen/apple/Assets.xcassets/AppIcon.appiconset/AppIcon-60x60@2x.png
      - name: Build simulator application
        run: cargo tauri ios build --target aarch64-sim
      - name: Verify generated export-compliance declaration
        run: |
          info_plist="$(find gen/apple -name Info.plist -print -quit)"
          test -n "$info_plist"
          test "$(plutil -extract ITSAppUsesNonExemptEncryption raw "$info_plist")" = "false"
          test "$(plutil -extract NSLocalNetworkUsageDescription raw "$info_plist")" = "Markerup connects directly to the SMB server you choose to access your Markdown workspace."
      - id: simulator
        name: Select an iOS 26.5 iPhone simulator
        run: |
          simulator_id="$(python3 - <<'PY'
          import json
          import subprocess

          devices = json.loads(
              subprocess.check_output(
                  ["xcrun", "simctl", "list", "devices", "available", "--json"],
                  text=True,
              )
          )["devices"]
          runtime = "com.apple.CoreSimulator.SimRuntime.iOS-26-5"
          for device in devices.get(runtime, []):
              if device.get("isAvailable") and device["name"].startswith("iPhone"):
                  print(device["udid"])
                  break
          else:
              raise SystemExit("no available iPhone simulator running iOS 26.5")
          PY
          )"
          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"
      - name: Install and launch Tauri simulator app
        run: |
          app_path="$(find gen/apple/build -type d -name '*.app' -print -quit)"
          test -d "$app_path"
          xcrun simctl boot '${{ steps.simulator.outputs.id }}' || true
          xcrun simctl bootstatus '${{ steps.simulator.outputs.id }}' -b
          xcrun simctl install '${{ steps.simulator.outputs.id }}' "$app_path"
          xcrun simctl launch '${{ steps.simulator.outputs.id }}' com.matt.markerup
      - uses: actions/upload-artifact@v4
        with: { name: markerup-ios-release-simulator, path: gen/apple/build/, if-no-files-found: error }
