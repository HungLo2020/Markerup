name: iOS build and simulator smoke test
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "ios-simulator-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: '26.0.1' }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with: { toolchain: stable, target: aarch64-apple-ios,aarch64-apple-ios-sim }
      - run: npm ci --prefix frontend
      - name: Build frontend for Rust configuration validation
        run: npm run build --prefix frontend
      - run: cargo install tauri-cli --version 2.11.4 --locked
      - name: Generate the canonical app icon for Apple project initialization
        run: cargo tauri icon resources/markerup_notepad_icon.svg --output icons --ios-color '#eaf4ff'
      - name: Initialize Tauri Apple project
        run: cargo tauri ios init --ci
      - name: Populate the generated iOS icon catalog from the canonical SVG
        run: cargo tauri icon resources/markerup_notepad_icon.svg --output icons --ios-color '#eaf4ff'
      - name: Remove alpha channels from generated iOS app icons
        # Apple rejects AppIcon PNGs that have an alpha channel even if every
        # pixel is opaque. The build script validates opacity and re-encodes
        # Tauri's SVG-derived RGBA files as RGB PNGs before Xcode compiles them.
        run: cargo check --lib --target aarch64-apple-ios
      - name: Verify generated iOS app icons are opaque RGB PNGs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct

          iconset = Path("gen/apple/Assets.xcassets/AppIcon.appiconset")
          icons = sorted(iconset.glob("*.png"))
          if not icons:
              raise SystemExit("generated iOS AppIcon catalog contains no PNG files")
          for icon in icons:
              header = icon.read_bytes()[:29]
              if header[:8] != b"\x89PNG\r\n\x1a\n" or header[12:16] != b"IHDR":
                  raise SystemExit(f"{icon} is not a valid PNG with an IHDR chunk")
              width, height, depth, color_type = struct.unpack(">IIBB", header[16:26])
              if depth != 8 or color_type != 2:
                  raise SystemExit(
                      f"{icon} is {width}x{height}, bit depth {depth}, PNG color type {color_type}; "
                      "AppIcon files must be 8-bit RGB (color type 2) with no alpha channel"
                  )
          PY
      - name: Verify app resources and privacy manifest
        run: |
          test -f ios/PrivacyInfo.xcprivacy
          plutil -lint ios/PrivacyInfo.xcprivacy
          test -f icons/icon.png
          test -f gen/apple/Assets.xcassets/AppIcon.appiconset/AppIcon-60x60@2x.png
      - name: Build simulator application
        run: cargo tauri ios build --target aarch64-sim
      - id: simulator
        run: echo "id=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')" >> "$GITHUB_OUTPUT"
      - name: Install and launch Tauri simulator app
        run: |
          app_path="$(find gen/apple/build -type d -name '*.app' -print -quit)"
          test -d "$app_path"
          xcrun simctl boot '${{ steps.simulator.outputs.id }}' || true
          xcrun simctl bootstatus '${{ steps.simulator.outputs.id }}' -b
          xcrun simctl install '${{ steps.simulator.outputs.id }}' "$app_path"
          xcrun simctl launch '${{ steps.simulator.outputs.id }}' com.matt.markerup
      - uses: actions/upload-artifact@v4
        with: { name: markerup-ios-release-simulator, path: gen/apple/build/, if-no-files-found: error }
