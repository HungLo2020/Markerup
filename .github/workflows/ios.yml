name: iOS build and simulator smoke test
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "ios-simulator-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: '26.0.1' }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with: { toolchain: stable, target: aarch64-apple-ios,aarch64-apple-ios-sim }
      - run: npm ci --prefix frontend
      - name: Build frontend for Rust configuration validation
        run: npm run build --prefix frontend
      - run: cargo install tauri-cli --version 2.11.4 --locked
      - name: Generate the canonical app icon for Apple project initialization
        run: cargo check --lib --target aarch64-apple-ios
      - name: Initialize Tauri Apple project
        run: cargo tauri ios init --ci
      - name: Verify app resources and privacy manifest
        run: |
          test -f ios/PrivacyInfo.xcprivacy
          plutil -lint ios/PrivacyInfo.xcprivacy
          test -f icons/icon.png
      - name: Build simulator application
        run: cargo tauri ios build --target aarch64-sim
      - id: simulator
        run: echo "id=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')" >> "$GITHUB_OUTPUT"
      - name: Install and launch Tauri simulator app
        run: |
          app_path="$(find gen/apple/build -type d -name '*.app' -print -quit)"
          test -d "$app_path"
          xcrun simctl boot '${{ steps.simulator.outputs.id }}' || true
          xcrun simctl bootstatus '${{ steps.simulator.outputs.id }}' -b
          xcrun simctl install '${{ steps.simulator.outputs.id }}' "$app_path"
          xcrun simctl launch '${{ steps.simulator.outputs.id }}' com.matt.markerup
      - uses: actions/upload-artifact@v4
        with: { name: markerup-ios-release-simulator, path: gen/apple/build/, if-no-files-found: error }
