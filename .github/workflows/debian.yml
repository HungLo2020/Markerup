name: Debian package release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: debian-release
  cancel-in-progress: true

jobs:
  build:
    name: Build Debian package
    runs-on: ubuntu-latest
    steps:
      - name: Check out selected source
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            dpkg-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgl1-mesa-dev \
            libwayland-dev \
            libx11-dev \
            libxkbcommon-dev

      - name: Select stable Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build Debian package
        env:
          MARKERUP_BUILD_NUMBER: ${{ github.run_id }}
        run: |
          set -euo pipefail
          cargo tauri build --bundles deb -- --locked
          mkdir -p release
          cp target/release/bundle/deb/*.deb release/
          sha256sum release/* > release/SHA256SUMS

      - name: Upload Debian package artifact
        uses: actions/upload-artifact@v4
        with:
          name: markerup-debian
          path: release/
          if-no-files-found: error

  release:
    name: Replace Debian release only
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Debian package artifact
        uses: actions/download-artifact@v4
        with:
          name: markerup-debian
          path: release-assets

      - name: Replace dedicated Debian release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete debian --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create debian \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title debian \
            --notes "Automated Debian package for ${GITHUB_SHA}. This release is independent of latest." \
            release-assets/markerup_*.deb \
            release-assets/SHA256SUMS
