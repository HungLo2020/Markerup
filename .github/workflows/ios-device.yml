name: Signed iOS device build
on:
  workflow_call:
    secrets:
      IOS_BUNDLE_ID:
        required: true
      IOS_TEAM_ID:
        required: true
      IOS_PROFILE_NAME:
        required: true
      IOS_CERTIFICATE_P12_BASE64:
        required: true
      IOS_CERTIFICATE_PASSWORD:
        required: true
      IOS_PROVISIONING_PROFILE_BASE64:
        required: true
      APPSTORE_API_PRIVATE_KEY:
        required: true
permissions:
  contents: read
jobs:
  device:
    runs-on: macos-15
    env:
      IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      IOS_PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
      IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_MOBILE_PROVISION: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      APPLE_DEVELOPMENT_TEAM: ${{ secrets.IOS_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: '26.0.1' }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with: { toolchain: stable, target: aarch64-apple-ios }
      - run: npm ci --prefix frontend
      - run: cargo install tauri-cli --version 2.11.4 --locked
      - run: cargo tauri ios init --ci
      - name: Install the signing certificate and App Store provisioning profile
        run: |
          keychain_path="$RUNNER_TEMP/markerup-signing.keychain-db"
          certificate_path="$RUNNER_TEMP/markerup-signing.p12"
          profile_path="$RUNNER_TEMP/markerup.mobileprovision"
          profile_plist="$RUNNER_TEMP/markerup-profile.plist"
          profile_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profile_dir"
          printf '%s' "$IOS_CERTIFICATE" | base64 --decode > "$certificate_path"
          printf '%s' "$IOS_MOBILE_PROVISION" | base64 --decode > "$profile_path"
          security cms -D -i "$profile_path" > "$profile_plist"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist")"
          test -n "$profile_uuid"
          security create-keychain -p "$IOS_CERTIFICATE_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$IOS_CERTIFICATE_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -s "$keychain_path"
          cp "$profile_path" "$profile_dir/$profile_uuid.mobileprovision"
      - name: Validate signing inputs and required resources
        run: |
          test -n "$IOS_BUNDLE_ID" && test -n "$IOS_TEAM_ID" && test -n "$IOS_PROFILE_NAME"
          test -n "$IOS_CERTIFICATE" && test -n "$IOS_CERTIFICATE_PASSWORD" && test -n "$IOS_MOBILE_PROVISION"
          plutil -lint ios/PrivacyInfo.xcprivacy
      - name: Build signed App Store Connect IPA
        run: |
          archive_path="$RUNNER_TEMP/Markerup.xcarchive"
          export_path="$RUNNER_TEMP/markerup-export"
          export_options="$RUNNER_TEMP/ExportOptions.plist"
          cat > "$export_options" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$IOS_TEAM_ID</string>
            <key>provisioningProfiles</key><dict>
              <key>$IOS_BUNDLE_ID</key><string>$IOS_PROFILE_NAME</string>
            </dict>
          </dict></plist>
          EOF
          xcodebuild \
            -workspace gen/apple/markerup.xcodeproj/project.xcworkspace \
            -scheme markerup_iOS \
            -configuration release \
            -sdk iphoneos \
            -archivePath "$archive_path" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME" \
            archive
          xcodebuild -exportArchive \
            -archivePath "$archive_path" \
            -exportOptionsPlist "$export_options" \
            -exportPath "$export_path"
      - id: ipa
        run: |
          ipa="$(find "$RUNNER_TEMP/markerup-export" -name '*.ipa' -print -quit)"
          test -f "$ipa"; echo "path=$ipa" >> "$GITHUB_OUTPUT"
      - uses: apple-actions/upload-testflight-build@v4
        with:
          app-path: ${{ steps.ipa.outputs.path }}
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          uses-non-exempt-encryption: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: markerup-ios-signed-device
          path: ${{ steps.ipa.outputs.path }}
          if-no-files-found: error
