name: Signed iOS device build
on:
  workflow_call:
    secrets:
      IOS_BUNDLE_ID:
        required: true
      IOS_TEAM_ID:
        required: true
      IOS_PROFILE_NAME:
        required: true
      IOS_CERTIFICATE_P12_BASE64:
        required: true
      IOS_CERTIFICATE_PASSWORD:
        required: true
      IOS_PROVISIONING_PROFILE_BASE64:
        required: true
      APPSTORE_API_PRIVATE_KEY:
        required: true
permissions:
  contents: read
jobs:
  device:
    runs-on: macos-26
    env:
      IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      IOS_PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
      IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_MOBILE_PROVISION: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      APPLE_DEVELOPMENT_TEAM: ${{ secrets.IOS_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: '26.6' }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with: { toolchain: stable, target: aarch64-apple-ios }
      - run: npm ci --prefix frontend
      - name: Build frontend for Rust configuration validation
        run: npm run build --prefix frontend
      - run: cargo install tauri-cli --version 2.11.4 --locked
      - name: Generate the canonical app icon for Apple project initialization
        run: cargo tauri icon resources/markerup_notepad_icon.svg --output icons --ios-color '#eaf4ff'
      - run: cargo tauri ios init --ci
      - name: Populate the generated iOS icon catalog from the canonical SVG
        run: cargo tauri icon resources/markerup_notepad_icon.svg --output icons --ios-color '#eaf4ff'
      - name: Remove alpha channels from generated iOS app icons
        # Apple rejects AppIcon PNGs that have an alpha channel even if every
        # pixel is opaque. This composites Tauri's SVG-derived RGBA files over
        # the configured iOS background and verifies RGB output before Xcode.
        run: python3 DevUtils/normalize_ios_app_icons.py
      - name: Install the signing certificate and App Store provisioning profile
        run: |
          keychain_path="$RUNNER_TEMP/markerup-signing.keychain-db"
          certificate_path="$RUNNER_TEMP/markerup-signing.p12"
          profile_path="$RUNNER_TEMP/markerup.mobileprovision"
          profile_plist="$RUNNER_TEMP/markerup-profile.plist"
          profile_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profile_dir"
          printf '%s' "$IOS_CERTIFICATE" | base64 --decode > "$certificate_path"
          printf '%s' "$IOS_MOBILE_PROVISION" | base64 --decode > "$profile_path"
          security cms -D -i "$profile_path" > "$profile_plist"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist")"
          test -n "$profile_uuid"
          security create-keychain -p "$IOS_CERTIFICATE_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$IOS_CERTIFICATE_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -s "$keychain_path"
          cp "$profile_path" "$profile_dir/$profile_uuid.mobileprovision"
      - name: Validate signing inputs and required resources
        run: |
          test -n "$IOS_BUNDLE_ID" && test -n "$IOS_TEAM_ID" && test -n "$IOS_PROFILE_NAME"
          test -n "$IOS_CERTIFICATE" && test -n "$IOS_CERTIFICATE_PASSWORD" && test -n "$IOS_MOBILE_PROVISION"
          plutil -lint ios/PrivacyInfo.xcprivacy
      - name: Configure the generated Tauri target for manual App Store signing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          project = Path("gen/apple/markerup.xcodeproj/project.pbxproj")
          source = project.read_text()
          settings = """\
                  CODE_SIGN_STYLE = Manual;
                  CODE_SIGN_IDENTITY = \"Apple Distribution\";
                  \"CODE_SIGN_IDENTITY[sdk=iphoneos*]\" = \"Apple Distribution\";
                  DEVELOPMENT_TEAM = \"{team}\";
                  \"DEVELOPMENT_TEAM[sdk=iphoneos*]\" = \"{team}\";
                  PROVISIONING_PROFILE_SPECIFIER = \"{profile}\";
                  \"PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]\" = \"{profile}\";
          """.format(team=os.environ["IOS_TEAM_ID"], profile=os.environ["IOS_PROFILE_NAME"])
          marker = "buildSettings = {\n"
          if marker not in source:
              raise SystemExit("generated Xcode project has no build settings to configure")
          project.write_text(source.replace(marker, marker + settings))
          PY
      - name: Build signed App Store Connect IPA
        run: cargo tauri ios build --export-method app-store-connect --build-number "$GITHUB_RUN_NUMBER"
      - id: ipa
        run: |
          ipa="$(find gen/apple/build -name '*.ipa' -print -quit)"
          test -f "$ipa"
          cp "$ipa" "$RUNNER_TEMP/Markerup.ipa"
          echo "path=$RUNNER_TEMP/Markerup.ipa" >> "$GITHUB_OUTPUT"
      - uses: apple-actions/upload-testflight-build@v4
        with:
          app-path: ${{ steps.ipa.outputs.path }}
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          uses-non-exempt-encryption: 'false'
          # Apple's upload completed successfully, but the action's delayed
          # processing poll can outlive its App Store Connect bearer token.
          # Processing remains asynchronous in App Store Connect.
          wait-for-processing: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: markerup-ios-signed-device
          path: ${{ steps.ipa.outputs.path }}
          if-no-files-found: error
