name: Signed iOS device build
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha:
        required: false
        type: string
permissions:
  contents: read
jobs:
  device:
    runs-on: macos-15
    env:
      IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      IOS_PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
      IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_MOBILE_PROVISION: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: '26.0.1' }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with: { toolchain: stable, target: aarch64-apple-ios }
      - run: npm ci --prefix frontend
      - run: cargo install tauri-cli --version 2.11.0 --locked --features mobile
      - run: cargo tauri ios init --ci
      - name: Validate signing inputs and required resources
        run: |
          test -n "$IOS_BUNDLE_ID" && test -n "$IOS_TEAM_ID" && test -n "$IOS_PROFILE_NAME"
          test -n "$IOS_CERTIFICATE" && test -n "$IOS_CERTIFICATE_PASSWORD" && test -n "$IOS_MOBILE_PROVISION"
          plutil -lint ios/PrivacyInfo.xcprivacy
      - name: Build signed App Store Connect IPA
        run: cargo tauri ios build --export-method app-store-connect
      - id: ipa
        run: |
          ipa="$(find gen/apple/build -name '*.ipa' -print -quit)"
          test -f "$ipa"; echo "path=$ipa" >> "$GITHUB_OUTPUT"
      - uses: apple-actions/upload-testflight-build@v4
        with:
          app-path: ${{ steps.ipa.outputs.path }}
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          uses-non-exempt-encryption: 'false'
      - uses: actions/upload-artifact@v4
        with: { name: markerup-ios-signed-device, path: ${{ steps.ipa.outputs.path }}, if-no-files-found: error }
