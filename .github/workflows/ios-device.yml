name: Signed iOS device build

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha:
        description: Commit SHA to build.
        required: false
        type: string

permissions:
  contents: read

jobs:
  device:
    name: Archive signed iOS app
    runs-on: macos-15
    env:
      IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      IOS_PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0.1'

      - name: Install Rust targets
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: aarch64-apple-ios

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          key: ios-device

      - name: Install XcodeGen and icon tooling
        run: brew install xcodegen librsvg imagemagick

      - name: Validate signing configuration
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          for value in IOS_BUNDLE_ID IOS_TEAM_ID IOS_PROFILE_NAME IOS_CERTIFICATE_P12_BASE64 IOS_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE_BASE64; do
            if [[ -z "${!value:-}" ]]; then
              echo "Missing required repository secret: $value"
              exit 1
            fi
          done

      - name: Install signing certificate and provisioning profile
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain_path="$RUNNER_TEMP/markerup-signing.keychain-db"
          certificate_path="$RUNNER_TEMP/markerup-signing.p12"
          profile_path="$RUNNER_TEMP/markerup.mobileprovision"
          profile_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profile_dir"

          printf '%s' "$IOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate_path"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profile_path"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -s "$keychain_path"
          cp "$profile_path" "$profile_dir/$IOS_PROFILE_NAME.mobileprovision"

      - name: Generate Xcode project
        working-directory: ios
        run: |
          ./generate_app_icons.sh
          xcodegen generate --spec project.yml

      - name: Validate generated iOS resources
        run: |
          test -f resources/markerup_notepad_icon.svg
          test -f ios/Info.plist
          test -f ios/PrivacyInfo.xcprivacy
          plutil -lint ios/PrivacyInfo.xcprivacy
          test -f ios/Assets.xcassets/AppIcon.appiconset/icon-60@2x.png
          test -f ios/Assets.xcassets/AppIcon.appiconset/icon-76@2x.png
          test -f ios/Assets.xcassets/AppIcon.appiconset/icon-1024.png
          file ios/Assets.xcassets/AppIcon.appiconset/icon-1024.png | grep -q '8-bit/color RGB'
          grep -q 'Assets.xcassets' ios/Markerup.xcodeproj/project.pbxproj
          grep -q 'LaunchScreen.storyboard' ios/Markerup.xcodeproj/project.pbxproj
          grep -q 'CFBundleIconName' ios/Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' ios/Info.plist)" = "false"
          grep -q 'UILaunchStoryboardName' ios/Info.plist
          grep -q 'UISupportedInterfaceOrientations' ios/Info.plist

      - name: Archive signed iOS application
        run: >-
          xcodebuild
          -project ios/Markerup.xcodeproj
          -scheme Markerup
          -configuration Release
          -sdk iphoneos
          -archivePath "$RUNNER_TEMP/Markerup.xcarchive"
          DEVELOPMENT_TEAM="$IOS_TEAM_ID"
          PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_ID"
          CURRENT_PROJECT_VERSION="${{ github.run_id }}"
          MARKETING_VERSION="0.3.0"
          CODE_SIGN_STYLE=Manual
          CODE_SIGN_IDENTITY="Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME"
          archive

      - name: Package signed IPA
        id: ipa
        run: |
          app_path="$RUNNER_TEMP/Markerup.xcarchive/Products/Applications/Markerup.app"
          payload_path="$RUNNER_TEMP/Payload"
          ipa_path="$RUNNER_TEMP/Markerup.ipa"
          test -d "$app_path"
          test -f "$app_path/PrivacyInfo.xcprivacy"
          plutil -lint "$app_path/PrivacyInfo.xcprivacy"
          profile_path="$RUNNER_TEMP/markerup.mobileprovision"
          test -f "$profile_path"
          cp "$profile_path" "$app_path/embedded.mobileprovision"
          codesign \
            --force \
            --sign "Apple Distribution" \
            --keychain "$RUNNER_TEMP/markerup-signing.keychain-db" \
            --timestamp=none \
            --preserve-metadata=entitlements,requirements,flags \
            "$app_path"
          codesign --verify --deep --strict "$app_path"
          rm -rf "$payload_path"
          mkdir -p "$payload_path"
          cp -R "$app_path" "$payload_path/"
          ditto -c -k --sequesterRsrc --keepParent "$payload_path" "$ipa_path"
          echo "ipa_path=$ipa_path" >> "$GITHUB_OUTPUT"

      - name: Upload build to TestFlight
        uses: apple-actions/upload-testflight-build@v4
        with:
          app-path: ${{ steps.ipa.outputs.ipa_path }}
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          uses-non-exempt-encryption: 'false'
          wait-for-processing: 'false'

      - name: Upload signed IPA and archive
        uses: actions/upload-artifact@v4
        with:
          name: markerup-ios-signed-device
          path: |
            ${{ steps.ipa.outputs.ipa_path }}
            ${{ runner.temp }}/Markerup.xcarchive/dSYMs
          if-no-files-found: error
