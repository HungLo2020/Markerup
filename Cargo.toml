[package]
name = "markerup"
version = "0.2.0"
edition = "2024"
description = "A filesystem-first Markdown notes editor"

[dependencies]
notify = "8.2.0"
percent-encoding = "2.3.2"
pulldown-cmark = "0.13.4"
slint = "1.17.1"
merman = { version = "0.7.0-alpha.1", default-features = false, features = ["render"] }

[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }

[build-dependencies]
slint-build = "1.17.1"
cc = "1.2.44"
