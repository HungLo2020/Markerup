[package]
name = "markerup"
version = "0.4.0"
edition = "2024"
description = "A filesystem-first Markdown notes editor"

[features]
default = []

[dependencies]
base64 = "0.22.1"
notify = "8.2.0"
percent-encoding = "2.3.2"
merman = { version = "0.7.0-alpha.1", default-features = false, features = ["render"] }
smb2 = "0.18.1"
tokio = { version = "1.53.1", features = ["io-util", "net", "rt", "rt-multi-thread", "sync", "time"] }
markdown = "1.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.5", default-features = false, features = ["wry", "x11"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2.5.4"

[build-dependencies]
cc = "1.2.44"
tauri-build = { version = "2.6.3", features = [] }
