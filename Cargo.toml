[package]
name = "markerup"
version = "0.3.0"
edition = "2024"
description = "A filesystem-first Markdown notes editor"

[features]
default = []
mobile-preview = []

[dependencies]
notify = "8.2.0"
percent-encoding = "2.3.2"
slint = "1.17.1"
merman = { version = "0.7.0-alpha.1", default-features = false, features = ["render"] }
smb2 = "0.18.1"
tokio = { version = "1.53.1", features = ["io-util", "net", "rt", "rt-multi-thread", "sync", "time"] }
markdown = "1.0.0"
serde_json = "1.0"

[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }

[build-dependencies]
slint-build = "1.17.1"
cc = "1.2.44"
